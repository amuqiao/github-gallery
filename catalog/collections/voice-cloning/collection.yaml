schema_version: 1
id: voice-cloning
title: 声音克隆项目
summary: 适合研究声音克隆、参考音频生成、多语言 TTS、音色转换和语音架构路线的开源项目。
publication_status: published
items:
  - project: gpt-sovits
    note: 适合学习完整音色克隆训练流程。
  - project: xtts
    note: 适合快速用参考音频做多语言 TTS。
  - project: cosyvoice
    note: 适合研究情绪、指令控制和中文语音能力。
  - project: f5-tts
    note: 适合关注 flow matching 路线和自然语音生成实验。
  - project: fish-speech
    note: 适合关注大模型语音生成和情绪表达能力。
  - project: openvoice
    note: 适合比较跨语言音色克隆和风格控制方案。
  - project: rvc
    note: 适合保留原音频语气，只替换音色。
  - project: amphion
    note: 适合系统研究 TTS、VC、SVC 和 vocoder 等不同架构。
details:
  type: markdown
  path: ./details.md
blocks:
  - type: highlights
    title: 对比维度
    items:
      - 声音克隆 TTS 使用文本和参考音频生成目标音色语音。
      - 声音转换 VC 保留源音频语气并替换成目标音色。
      - 研究工具箱更适合系统学习多任务和多架构路线。
  - type: use-cases
    title: 选择建议
    items:
      - 想学习完整训练流程时优先比较 GPT-SoVITS。
      - 想快速用参考音频生成多语言语音时比较 XTTS、F5-TTS 和 CosyVoice。
      - 想只换音色并保留原音频语气时比较 RVC。
