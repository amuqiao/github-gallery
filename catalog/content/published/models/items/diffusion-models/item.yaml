blocks:
  - type: links
    items:
      - label: DDPM Paper
        url: https://arxiv.org/abs/2006.11239
  - type: highlights
    title: 模型要点
    items:
      - Diffusion is a model family and generative modeling framework, not one concrete model.
      - Common core is forward noising plus learned reverse denoising.
      - Variants differ in sampling process, score/SDE view, latent space, network backbone and conditioning.
  - type: use-cases
    items:
      - 建立扩散模型家族、具体模型和产品之间的层级关系。
      - 学习 DDPM、DDIM、Latent Diffusion、Flow Matching 等分支前的全局地图。
      - 为后续 Stable Diffusion、DiT、Flux 或视频扩散专题做入口。
