      - label: Paper Overview
        url: https://paperswithcode.com/paper/is-someone-speaking-exploring-long-term
  - type: highlights
    items:
      - 用音频和视觉时序证据判断画面中的候选人脸是否正在说话。
      - 结合音频/视觉 temporal encoder、跨模态交互和长时序 self-attention。
      - 适合理解 active speaker detection 中短时线索和长时上下文的分工。
  - type: use-cases
    items:
      - 学习主动说话人检测模型如何融合音频与视觉信息。
      - 评估访谈、会议、影视视频中的说话人定位能力。
      - 对比 VAD、speaker diarization、face tracking 和 ASD 模型的边界。
