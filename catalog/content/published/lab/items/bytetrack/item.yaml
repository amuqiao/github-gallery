  - type: highlights
    items:
      - 通过关联每一个检测框改善多目标跟踪中的遮挡和低分框问题。
      - 高分框提供可靠匹配，低分框用于帮助已有轨迹恢复被遮挡目标。
      - 跟踪质量依赖检测器输出、阈值设置、运动预测和匹配策略。
