  - type: highlights
    items:
      - 判断视频中哪一张可见人脸与当前音频语音活动对应。
      - 需要结合人脸轨迹、嘴部运动、语音活动和跨模态时序证据。
      - 常见错误来自遮挡、旁白、多人同屏、画外音、配音和音画不同步。
  - type: use-cases
    items:
      - 学习音视频多模态任务如何定义输入、输出和标注边界。
      - 为会议、访谈、影视剪辑或说话人分离系统建立前处理能力。
      - 对比 VAD、speaker diarization、face tracking 和 active speaker detection 的职责。
