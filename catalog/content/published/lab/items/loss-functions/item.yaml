  - type: highlights
    items:
      - 损失函数把预测误差转化为可优化的训练信号。
      - 回归、分类、排序和生成任务通常需要不同损失设计。
      - 目标函数可以包含损失项、正则化项和其他约束项。
  - type: use-cases
    items:
      - 区分 MSE、MAE、交叉熵和二分类交叉熵。
      - 理解 logits、softmax、sigmoid 与交叉熵的配套关系。
      - 判断训练损失和业务评估指标不一致时该如何分析。
