blocks:
  - type: links
    items:
      - label: Documentation
        url: https://developer.apple.com/xcode/swiftui/
  - type: highlights
    items:
      - 声明式描述 UI，由状态变化驱动视图重新计算。
      - 通过 View、modifier、layout、binding 和 environment 组合界面。
      - 可覆盖 iOS、macOS、watchOS、tvOS 和 visionOS 等 Apple 平台。
