blocks:
  - type: links
    items:
      - label: Documentation
        url: https://docs.temporal.io/
  - type: highlights
    items:
      - 用普通代码描述长期业务流程，由 Temporal 持久化执行历史和流程进度。
      - 通过 Event History 与 replay 在 Worker 崩溃、重启或部署后恢复 Workflow 状态。
      - 将确定性编排放在 Workflow 中，将外部副作用、I/O 和幂等处理放在 Activity 中。
  - type: use-cases
    items:
      - 学习 durable execution、Workflow、Activity、Worker 和 Task Queue 的职责边界。
      - 评估订单履约、审批流、支付补偿和跨服务长流程是否适合引入 Temporal。
      - 对比 Temporal 与消息队列、cron、Airflow、BPMN 和手写 saga 状态机。
