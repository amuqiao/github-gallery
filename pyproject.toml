[project]
name = "github-gallery"
version = "0.1.0"
description = "Local FastAPI gallery for collecting and categorizing GitHub repositories."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.50.2",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
