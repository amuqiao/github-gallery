services:
  app:
    profiles: ["proxy"]
    image: ${APP_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "github-gallery.mode=proxy"
      - "github-gallery.proxy-host=${PROXY_HOST}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
